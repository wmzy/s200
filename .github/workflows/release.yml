name: Release

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.releaserc.json'
      - '.github/workflows/release.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - '.releaserc.json'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  release:
    if: github.event_name != 'pull_request'
    outputs:
      published: ${{ steps.release.outputs.published }}
      version: ${{ steps.release.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release 需要完整历史与 tag 计算上一版本。
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # s200 的 `test` 脚本是 watch 模式，CI 里必须显式 run。
      - name: Run tests
        run: pnpm vitest run --maxWorkers=2

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm 发布时经 OIDC 附加 provenance（npm 侧信任已配置）。
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          # 一次性：首发钉在 0.1.0。semantic-release 对「无历史
          # release」的首发固定给 1.0.0（minor 也一样），而本项目
          # 首发应为 0.1.0；误发的 1.0.0 已撤回。发布成功后本步
          # 恢复为 `npx semantic-release`（v0.1.0 成为其基线）。
          npm version 0.1.0 --no-git-tag-version
          npm publish --access public
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "version=0.1.0" >> "$GITHUB_OUTPUT"
          # 持久化基线：tag 经 API 创建（checkout 关了 persist-credentials）。
          gh api repos/wmzy/s200/git/refs \
            -f ref=refs/tags/v0.1.0 \
            -f "sha=$(git rev-parse HEAD)"
          gh release create v0.1.0 -R wmzy/s200 --generate-notes --title "v0.1.0"

  # PR 发布预演：对 PR 的合并结果完整跑一遍 semantic-release --dry-run——
  # 校验 .releaserc 配置与 NPM_TOKEN 可用性，并预演下一版本号与变更日志；
  # dry-run 不会创建 tag / GitHub Release / npm 包。
  preview:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 降不下来：semantic-release 在分析前用 `git push --dry-run` 探测写权限
    # （verifyAuth），read-only 的 GITHUB_TOKEN 会被 GitHub 拒绝，随即以
    # 「local branch is behind」为由静默跳过预演。同仓库 PR 才能拿到
    # contents:write（fork PR 恒为只读，对应分支已在下方 step 级 if 跳过）。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Release dry-run (preview next version)
        # fork PR 拿不到 secrets（NPM_TOKEN），GITHUB_TOKEN 也是只读——
        # 无法完成任何有意义的校验，跳过而非挂红。
        if: github.event.pull_request.head.repo.fork == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # semantic-release 经 env-ci 识别 pull_request 事件后会直接短路
          # （"This run was triggered by a pull request ..."）；且 PR 的
          # GITHUB_REF 是 refs/pull/N/merge，随后的分支白名单校验也会提前
          # 退出。把 env-ci 探测的两个变量伪装成「推送到 base 分支」，
          # 让它按合并结果的语义完整跑 commit 分析 / verifyConditions /
          # generateNotes（tag 与 publish 仍被 --dry-run 跳过）。
          GITHUB_EVENT_NAME: push
          GITHUB_REF: refs/heads/${{ github.event.pull_request.base.ref }}
        run: |
          set -o pipefail
          npx semantic-release --dry-run 2>&1 | tee semantic-release-dry-run.log
          # 预演必须产出确定结论：要么算出下一版本，要么明确「无可发布变更」。
          # 若伪装失效（semantic-release 升级改了行为/日志），宁可挂红也不
          # 假绿。
          grep -qE "The next release version is|There are no relevant changes" semantic-release-dry-run.log

  # 发布后 smoke：npm registry 的 tarball 传播有延迟，轮询直到新版本可见，
  # 再在临时目录安装该版本，验证各入口可导入 + 路由闭环。
  smoke:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wait for s200@${{ needs.release.outputs.version }} on npm
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 300))
          delay=5
          while true; do
            if url="$(npm view "s200@$VERSION" dist.tarball 2>/dev/null)" && [ -n "$url" ]; then
              echo "tarball visible: $url"
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::s200@$VERSION not visible on npm after 300s"
              exit 1
            fi
            echo "not visible yet; retrying in ${delay}s"
            sleep "$delay"
            delay=$(( delay >= 60 ? 60 : delay * 2 ))
          done

      - name: Install and import the published package
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          cd "$dir"
          # s200 核心零依赖，干净目录即可验证打包产物。
          npm install --no-audit --no-fund "s200@$VERSION"
          node --input-type=module -e "
            import { createApp, use, get, post, handle, json, text, readJson } from 's200';
            import { serve } from 's200/node';
            import { cors } from 's200/cors';
            const main = import.meta.resolve('s200');
            if (!main.includes('/dist/')) throw new Error('unexpected main entry: ' + main);
            const app = createApp();
            use(app, async (ctx, next) => { await next(); });
            get(app, '/ping', (ctx) => text(ctx, 'pong'));
            post(app, '/echo', async (ctx) => json(ctx, await readJson(ctx)));
            if (typeof handle !== 'function' || typeof serve !== 'function' || typeof cors !== 'function') {
              throw new Error('missing export');
            }
            console.log('smoke ok — s200@$VERSION, main:', main);
          "
