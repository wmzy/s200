name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ci
      - run: pnpm check:paradigm
      - run: pnpm typecheck

      # Bounded workers: the router micro-bench and smoke run in the same
      # job, and GitHub's runners have ~7 GB to share.
      - run: pnpm vitest run --maxWorkers=2

      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm lint:pkg
      - run: pnpm attw
      - run: pnpm verify:tree-shaking
      - run: pnpm size

      # Router dispatch regression gate: ROUTES/ITERATIONS are fixed so
      # micro-benchmark noise stays comparable across runs.
      - name: Router bench regression
        run: pnpm bench
        env:
          ROUTES: 200
          ITERATIONS: 100000

      # smoke exercises the built dist under node AND bun (bun also covers
      # the s200/websocket/bun bridge).
      - uses: oven-sh/setup-bun@v2
      - run: pnpm smoke

      # Examples drive the real app.ts of each template (they resolve the
      # workspace src/ via examples/ts-resolve.mjs). They run after the bun
      # setup above so ws-chat's spawned bun ws round trip is exercised
      # rather than skipped.
      - run: pnpm --filter @s200-example/rest-jwt smoke
      - run: pnpm --filter @s200-example/sse-dashboard smoke
      - run: pnpm --filter @s200-example/ws-chat smoke
      - run: pnpm --filter @s200-example/upload-app smoke
      - run: pnpm --filter @s200-example/db-crud smoke
      - run: pnpm --filter @s200-example/crud-openapi smoke
      - run: pnpm --filter @s200-example/hello-world smoke

  # Floor-runtime gate: `engines` declares node >= 20.3, but the toolchain
  # (vite/vitest) may itself need newer node — that says nothing about the
  # published package's floor. So the floor job never runs the toolchain on
  # the old node: everything installs and builds under node 22, then a
  # SECOND setup-node (no cache) puts the matrix version first on PATH and
  # only scripts/smoke-floor.mjs runs under it — a dependency-free script
  # (node stdlib + dist/ artifacts only) that serves the built package end
  # to end, proving the artifacts honor the declared minimum.
  floor:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['20.3', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      # Toolchain runs here: install/build on node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Second setup-node PREPENDS the floor node to PATH (cache omitted —
      # the pnpm store was already primed by the node 22 step above).
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: node scripts/smoke-floor.mjs

  # Cloudflare Workers gate: the s200/cloudflare module-worker fetch shape
  # (createHandler) must serve through REAL workerd. miniflare drives it —
  # it is not a devDependency (the workerd binary is heavy and local runs
  # auto-skip), so CI installs it transiently and restores the manifest
  # files it mutates afterwards.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Pin the stable 4 line: the 5.x line is alpha-only and reworked the
      # constructor API around a `workers[]` array, which the classic
      # ModuleDefinition smoke does not target. Exact pin keeps the gate
      # deterministic.
      - run: pnpm add -Dw miniflare@4.20260730.0

      - run: node scripts/smoke-cloudflare.mjs

      - name: Restore manifests mutated by the transient miniflare install
        if: always()
        run: git checkout -- package.json pnpm-lock.yaml
