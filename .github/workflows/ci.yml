name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint:ci
      - run: pnpm check:paradigm
      - run: pnpm typecheck

      # Bounded workers: the router micro-bench and smoke run in the same
      # job, and GitHub's runners have ~7 GB to share.
      - run: pnpm vitest run --maxWorkers=2

      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm lint:pkg
      - run: pnpm attw
      - run: pnpm verify:tree-shaking
      - run: pnpm size

      # Router dispatch regression gate: ROUTES/ITERATIONS are fixed so
      # micro-benchmark noise stays comparable across runs.
      - name: Router bench regression
        run: pnpm bench
        env:
          ROUTES: 200
          ITERATIONS: 100000

      # smoke exercises the built dist under node AND bun (bun also covers
      # the s200/websocket/bun bridge).
      - uses: oven-sh/setup-bun@v2
      - run: pnpm smoke

      # Examples drive the real app.ts of each template (they resolve the
      # workspace src/ via examples/ts-resolve.mjs). They run after the bun
      # setup above so ws-chat's spawned bun ws round trip is exercised
      # rather than skipped.
      - run: pnpm --filter @s200-example/rest-jwt smoke
      - run: pnpm --filter @s200-example/sse-dashboard smoke
      - run: pnpm --filter @s200-example/ws-chat smoke
      - run: pnpm --filter @s200-example/upload-app smoke

  # Deno runtime gate: the core is plain Web Standard code, so the same
  # built dist must also serve through Deno.serve — smoke-deno.mjs writes
  # a tmp entry that imports dist/index.mjs by file URL, spawns
  # `deno run --allow-net`, and asserts the core end to end with fetch.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: node scripts/smoke-deno.mjs

  # Cloudflare Workers gate: the s200/cloudflare module-worker fetch shape
  # (createHandler) must serve through REAL workerd. miniflare drives it —
  # it is not a devDependency (the workerd binary is heavy and local runs
  # auto-skip), so CI installs it transiently and restores the manifest
  # files it mutates afterwards.
  cloudflare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      # Bare specifier resolves via the `latest` dist-tag — semver ranges
      # like miniflare@5 would NOT match the 5.x prereleases that tag
      # currently points at.
      - run: pnpm add -Dw miniflare

      - run: node scripts/smoke-cloudflare.mjs

      - name: Restore manifests mutated by the transient miniflare install
        if: always()
        run: git checkout -- package.json pnpm-lock.yaml
