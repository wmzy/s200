# 一次性任务：回滚误发的 1.0.0，把首发钉在 0.1.0。
# 背景：semantic-release 对「无历史 release」的首发固定给 1.0.0
# （minor 也一样），而本项目首发版本应为 0.1.0。完成后删除本文件，
# 后续版本回到 release.yml 的 semantic-release（v0.1.0 成为其基线）。
name: Publish initial 0.1.0

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Roll back the accidental 1.0.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 1.0.0 发布于数分钟前、无依赖者，在 npm 72h 可撤窗口内。
          npm unpublish s200@1.0.0 --force
          # 删除 semantic-release 留下的 tag 与 GitHub Release，
          # 否则它会继续以 1.0.0 为 semver 基线。
          gh release delete v1.0.0 -R wmzy/s200 -y >/dev/null 2>&1 || true
          git tag -d v1.0.0 || true
          git push origin :refs/tags/v1.0.0 || true

      - name: Publish s200@0.1.0
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # 与 release.yml 一致：经 OIDC 附加 provenance。
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -euo pipefail
          npm version 0.1.0 --no-git-tag-version
          npm publish --access public

      - name: Tag and release v0.1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git tag v0.1.0
          git push origin v0.1.0
          gh release create v0.1.0 -R wmzy/s200 --generate-notes --title "v0.1.0"
