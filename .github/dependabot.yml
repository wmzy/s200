version: 2

updates:
  # Root workspace package: npm dependencies (all devDependencies here).
  # Everything lands as ONE grouped PR per week so bumps are validated by a
  # single CI run instead of fragmenting the (locked) toolchain.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns:
          - '*'
    ignore:
      # typescript-eslint 不支持 TS 7（CI lint:ci 挂），major 升级等到支持后再放开。
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  # Workflow actions (checkout, setup-node, codecov, …) — one grouped PR.
  - package-ecosystem: github-actions
    directory: .github/workflows
    schedule:
      interval: weekly
    groups:
      workflow-actions:
        patterns:
          - '*'
